; PlatformIO Project Configuration File
; RFID-Shift-Mate 2 Firmware
;
; Build and upload:
;   pio run               - build firmware
;   pio run --target upload - build and flash
;   pio run --target uploadfs - flash filesystem
;   pio device monitor    - serial monitor

[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200

; Partition scheme: 4MB flash
; 1.5MB app, 1.5MB SPIFFS, NVS, etc.
board_build.partitions = default_4MB.csv

; Filesystem
board_build.filesystem = littlefs
board_build.data_dir = data/www

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DASYNCWEBSERVER_REGEX=1
    -DBOARD_HAS_PSRAM=0
    ; Display
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=15
    -DTFT_BL=12
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; Library dependencies
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.0
    miguelbalboa/MFRC522 @ ^1.4.11
    adafruit/RTClib @ ^2.1.3
    thomasfredericks/Bounce2 @ ^2.70

; Library dependency finder
lib_ldf_mode = deep+
lib_compat_mode = strict

; Upload settings
upload_speed = 921600

; Monitor filters
monitor_filters = 
    esp32_exception_decoder
    default
